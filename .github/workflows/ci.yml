name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: gcc:16.2.0-trixie
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CC: gcc
      CXX: g++
      CMAKE_PREFIX_PATH: /usr/lib/llvm-22
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CTEST_PARALLEL_LEVEL: "4"
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake git libclang-22-dev ninja-build python3 zlib1g-dev
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and test
        run: scripts/ci.sh test

  clang-fixtures:
    runs-on: ubuntu-latest
    container: gcc:16.2.0-trixie
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CC: gcc
      CXX: g++
      CMAKE_PREFIX_PATH: /usr/lib/llvm-22
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CTEST_PARALLEL_LEVEL: "4"
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang-22 clang-tools-22 cmake git libclang-22-dev libclang-rt-22-dev \
            libc++-19-dev libc++abi-19-dev lld-22 llvm-22 ninja-build \
            python3 python3-unicorn zlib1g-dev
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and test Clang fixtures
        run: |
          export PATH="/usr/lib/llvm-22/bin:$PATH"
          scripts/ci.sh test
      - name: Build core with Clang and libc++
        run: |
          export PATH="/usr/lib/llvm-22/bin:$PATH"
          CC=clang CXX=clang++ scripts/ci.sh clang
