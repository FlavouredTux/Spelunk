name: release

# Build the C++ CLI for Linux / Windows and upload the artifacts. Two triggers:
#   - tag push (v*) publishes a GitHub Release with the artifacts
#   - manual (workflow_dispatch) uploads workflow artifacts only
#
# macOS is intentionally out of scope for packaged releases until the
# CLI no longer depends on <print>/std::println support that the
# macos-14 Apple clang/libc++ toolchain does not provide.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    container: gcc:16

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y cmake ninja-build python3

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build CLI
        run: cmake --build build --target ember_cli

      # No ctest here; release is gated on successful build only.
      # Golden tests live in ci.yml and have their own drift to chase.

      - name: Package CLI
        run: cmake -E tar czf ember-linux-x86_64.tar.gz build/cli/ember

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ember-linux-x86_64
          path: ember-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ember-linux-x86_64.tar.gz
          fail_on_unmatched_files: false
          overwrite_files: true
          body_path: .github/release-notes/${{ github.ref_name }}.md

  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Windows toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build CLI
        run: cmake --build build --target ember_cli

      # No ctest here; release is gated on successful build only.
      # Golden tests live in ci.yml and have their own drift to chase.

      - name: Package CLI
        run: cmake -E tar cf ember-windows-x86_64.zip --format=zip build/cli/ember.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ember-win
          path: ember-windows-x86_64.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ember-windows-x86_64.zip
          fail_on_unmatched_files: false
          overwrite_files: true
          body_path: .github/release-notes/${{ github.ref_name }}.md
